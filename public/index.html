<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenReactor</title>
    <meta
      name="description"
      content="OpenReactor turns clear product requests into public work."
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="intake" aria-labelledby="page-title">
        <div class="masthead">
          <h1 class="wordmark" id="page-title">OpenReactor</h1>
          <a
            id="repo-star-link"
            class="repo-star-link"
            href="#"
            target="_blank"
            rel="noreferrer"
            hidden
          >
            <svg
              class="repo-star-icon"
              viewBox="0 0 16 16"
              aria-hidden="true"
            >
              <path
                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
                0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
                -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
                .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
                -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09
                2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82
                2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01
                2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
              ></path>
            </svg>
            <span>Star on GitHub</span>
          </a>
        </div>
        <p class="page-copy">
          Submit a request, then watch the public queue track it from queued to in progress, complete, or rejected.
        </p>

        <form id="request-form" class="request-form" novalidate>
          <label class="request-label" for="request">
            <span class="sr-only">Request</span>
            <textarea
              id="request"
              name="request"
              rows="6"
              maxlength="2000"
              minlength="20"
              placeholder="Describe the product change in plain language. Repeated filler text will be rejected."
              required
            ></textarea>
          </label>

          <label class="honeypot" aria-hidden="true">
            <span>Website</span>
            <input id="website" name="website" tabindex="-1" autocomplete="off" />
          </label>

          <div class="form-footer">
            <button class="submit-button" id="submit-button" type="submit" aria-label="Submit request">
              <span aria-hidden="true">+</span>
            </button>
          </div>

          <p id="form-status" class="status-message" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="queue" aria-labelledby="queue-title">
        <div class="queue-header">
          <div>
            <p class="queue-kicker">Live queue</p>
            <h2 id="queue-title">Recent public requests and outcomes</h2>
          </div>

          <a
            id="queue-repo-link"
            class="queue-link"
            href="#"
            target="_blank"
            rel="noreferrer"
            hidden
          >
            View on GitHub
          </a>
        </div>

        <p id="queue-status" class="queue-status" role="status" aria-live="polite">
          Loading recent requests...
        </p>
        <ul id="queue-list" class="queue-list"></ul>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
