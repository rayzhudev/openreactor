<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenReactor</title>
    <meta
      name="description"
      content="OpenReactor turns clear product requests into public work."
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="intake" aria-labelledby="page-title">
        <div class="masthead">
          <h1 class="wordmark" id="page-title">OpenReactor</h1>
          <a
            id="repo-star-link"
            class="repo-star-link"
            href="#"
            target="_blank"
            rel="noreferrer"
            hidden
          >
            Star on GitHub
          </a>
        </div>
        <p class="page-copy">
          Submit a request, then watch the public queue update in GitHub.
        </p>

        <form id="request-form" class="request-form" novalidate>
          <label class="request-label" for="request">
            <span class="sr-only">Request</span>
            <textarea
              id="request"
              name="request"
              rows="6"
              maxlength="2000"
              minlength="20"
              placeholder="Enter your feature request for OpenReactor. The only website that builds itself"
              required
            ></textarea>
          </label>

          <label class="honeypot" aria-hidden="true">
            <span>Website</span>
            <input id="website" name="website" tabindex="-1" autocomplete="off" />
          </label>

          <div class="form-footer">
            <button class="submit-button" id="submit-button" type="submit" aria-label="Submit request">
              <span aria-hidden="true">+</span>
            </button>
          </div>

          <p id="form-status" class="status-message" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="queue" aria-labelledby="queue-title">
        <div class="queue-header">
          <div>
            <p class="queue-kicker">Live queue</p>
            <h2 id="queue-title">Recent public requests</h2>
          </div>

          <a
            id="queue-repo-link"
            class="queue-link"
            href="#"
            target="_blank"
            rel="noreferrer"
            hidden
          >
            View on GitHub
          </a>
        </div>

        <p id="queue-status" class="queue-status" role="status" aria-live="polite">
          Loading recent requests...
        </p>
        <ul id="queue-list" class="queue-list"></ul>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
